---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: yandex-s3-csi-test-pvc
  namespace: csi-test
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
      # storage: 10Pi
  storageClassName: csi-s3
---
apiVersion: v1
kind: Pod
metadata:
  name: yandex-s3-csi-test-app
  namespace: csi-test
spec:
  containers:
  - args:
    - -c
    - while true; do echo Fri May 17 18:20:12 UTC 2024 >> /data/out.txt; sleep 5; done
    command:
    - /bin/sh
    image: busybox
    name: app
    volumeMounts:
    - mountPath: /data
      name: yandex-s3-csi-test-pv
  volumes:
  - name: yandex-s3-csi-test-pv
    persistentVolumeClaim:
      claimName: yandex-s3-csi-test-pvc

