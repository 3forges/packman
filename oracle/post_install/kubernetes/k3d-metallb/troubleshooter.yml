version: '3.7'
# - https://www.mongodb.com/compatibility/docker
services:
  k3d_net_plumber:
    image: decoderleco/k3d_net_plumber:0.0.1-alpha
    build:
      context: ./oci/k3d_net_plumber/
      dockerfile: Dockerfile
      # dockerfile: prod.Dockerfile
      args:
        PLUMBER_HOME: /usr/plumber
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # - k3d_net_plumber_data:/usr/plumber/data
    restart: always
    stdin_open: true 
    tty: true
    # env_file: .troubleshooter.env
    environment:
      # - K3D_NET_FIRST_ADDR=172.19.0.240
      - K3D_NET_FIRST_ADDR=$K3D_NET_FIRST_ADDR
      # - K3D_NET_RANGE=172.19.0.240/29
      - K3D_NET_RANGE=$K3D_NET_RANGE
    ports:
        - '0.0.0.0:8888:8888'
    networks:
      decoderleco_knet:
        aliases:
          - k3d_net_plumber.dataviz_poc.io
          - k3d_net_plumber.io

# volumes:
#   k3d_net_plumber_data:
networks:
  decoderleco_knet:
    driver: bridge









